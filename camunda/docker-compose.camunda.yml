# ==================================================
# SONGNHAT COPILOT — Camunda 7 BPM Platform (CRM-44)
#
# Run from project root or camunda directory:
#   docker compose -f camunda/docker-compose.camunda.yml up -d
# ==================================================

services:
  camunda:
    image: camunda/camunda-bpm-platform:run-7.20.0
    container_name: songnhat-camunda
    restart: unless-stopped
    ports:
      - "${CAMUNDA_PORT:-8080}:8080"
    volumes:
      - ./ticket-triage.bpmn:/camunda/configuration/resources/ticket-triage.bpmn:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/engine-rest/engine || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
