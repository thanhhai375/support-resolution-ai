name: CI/CD Pipeline — SongNhat Support Resolution Copilot

on:
  push:
    branches: [ develop-from-main, main ]
  pull_request:
    branches: [ develop-from-main, main ]

jobs:
  # ─── 1. Backend Build & Test (FastAPI + Pytest) ─────────────────
  backend:
    name: Backend Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Backend Unit & Auth Tests
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v

      - name: Run AI Copilot Benchmark Validation
        working-directory: ./backend
        run: |
          python test_crm24.py

  # ─── 2. Frontend Build & Typecheck (React + Vite) ───────────────
  frontend:
    name: Frontend Build & Typecheck (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck and Build
        working-directory: ./frontend
        run: npm run build

  # ─── 3. Pipeline Summary ────────────────────────────────────────
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Display Status
        run: |
          echo "============================================="
          echo " CI/CD Pipeline Execution Summary"
          echo "============================================="
          echo "Backend Test Status : ${{ needs.backend.result }}"
          echo "Frontend Build Status: ${{ needs.frontend.result }}"
          echo "============================================="
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Pipeline FAILED!"
            exit 1
          else
            echo "✅ Pipeline PASSED successfully!"
          fi
