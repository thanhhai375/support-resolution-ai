name: CI/CD Pipeline — CRM Support Resolution Copilot

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # ─── Backend Build & Test ───────────────────────────────────────
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if backend exists
        id: check_backend
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏳ Backend chưa được setup — bỏ qua bước build"
          fi

      - name: Setup Java 17
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Backend
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        run: mvn clean verify

  # ─── Frontend Build & Test ──────────────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏳ Frontend chưa được setup — bỏ qua bước build"
          fi

      - name: Setup Node.js 18
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # ─── Summary ────────────────────────────────────────────────────
  notify:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Print result
        run: |
          echo "Backend : ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
